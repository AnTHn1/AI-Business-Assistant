services:
  db:
    image: postgres:16-alpine
    container_name: aibusiness_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: aibusiness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: aibusiness_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: